[package]
name = "autobo"
version = "0.1.0"
edition = "2021"

[lib]
name = "autobo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "autobo"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serialize-to-javascript = "0.1"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls", "builder"] }
tokio-cron-scheduler = "0.13"
quick-xml = { version = "0.37", features = ["serialize"] }
pdf-extract = "0.7"
regex = "1"
base64 = "0.22"
aes-gcm = "0.10"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "5"
printpdf = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
time = "=0.3.36"
rust_decimal = { version = "1.43.0", features = ["serde"] }
keyring = { version = "3", features = ["linux-native", "sync-secret-service", "crypto-rust"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
